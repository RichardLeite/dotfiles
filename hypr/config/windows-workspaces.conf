# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Regra Universal para Jogos (Steam, Heroic, Proton, Wine e Gamescope)
windowrule = match:class ^(steam_app_\w+|gamescope|steam_proton|.*wine.*|.*\.exe.*)$, match:title negative:^(Rockstar Games Launcher)$, monitor HDMI-A-2
windowrule = match:class ^(steam_app_\w+|gamescope|steam_proton|.*wine.*|.*\.exe.*)$, match:title negative:^(Rockstar Games Launcher)$, fullscreen on


# Example windowrule
# windowrule = float on,match:class ^(kitty)$,match:title ^(kitty)$
windowrule = float on,match:class ^(com.saivert.pwvucontrol)$
windowrule = float on,match:class ^(qalculate-gtk)$
windowrule = float on,match:class ^(com.github.maoschanz.drawing)$

# Focar automaticamente em janelas de debug
windowrule = focus_on_activate on,match:class (com.visualstudio.code),match:title (Debug).*
windowrule = focus_on_activate on,match:class (code-oss),match:title (Debug).*
windowrule = focus_on_activate on,match:class (jetbrains-.*),match:title (Debug).*

# Focar automaticamente em novas janelas de terminal
windowrule = focus_on_activate on,match:class (kitty|alacritty|foot|wezterm|dev.warp.Warp)

# Focar automaticamente em navegadores
windowrule = focus_on_activate on,match:class (firefox|google-chrome|chromium|brave-browser|zen)

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# Melhorar o gerenciamento de foco
# Desabilitado temporariamente em 2026-07-29 pra testar se as regras
# `focus_on_activate on,match:class .*` estao interferindo no boot,
# fazendo apps abrirem no workspace errado (porque o gcr-prompter
# aparece e rouba foco, mudando o workspace ativo).
# Reativar se o teste mostrar que o problema NAO e esse.
# windowrule = focus_on_activate on,match:class .*
# windowrule = focus_on_activate on,match:title .*

# Focar automaticamente em janelas de notificação
windowrule = focus_on_activate on,match:title ^(Notification|Aviso|Erro|Alerta|Confirmação) floating:1

# Regra para o Spotify abrir sempre no workspace 13
windowrule = workspace 13 silent,match:class ^(com.spotify.Client)$
windowrule = workspace 13 silent,match:class ^(spotify)$

# xembedsniproxy: ponte XEmbed -> SNI para apps Wine/Proton (Rockstar, etc).
# A janela orfa 32x32 e invisivel, nao recebe foco, e e mandada pro special
# workspace pra nao aparecer na barra de workspaces do Ambsst/Hyprland.
windowrule = workspace special silent,match:class ^(xembedsniproxy)$
windowrule = no_focus on,match:class ^(xembedsniproxy)$
windowrule = opacity 0 0,match:class ^(xembedsniproxy)$

# gcr-prompter (GNOME Keyring unlock dialog): aparece no boot quando algum
# app tenta acessar o keyring. Sem regra, ele rouba foco via
# `focus_on_activate on,match:class .*` (linhas acima) e faz os apps do
# autostart abrirem no workspace errado. Mantemos ele no workspace 1
# (onde o usuario espera) e desabilitamos o auto-focus pra ele nao
# roubar o foco dos apps que estao subindo.
windowrule = workspace 1 silent,match:class ^(gcr-prompter)$
windowrule = focus_on_activate off,match:class ^(gcr-prompter)$

# hyprland-dialog: popup do proprio Hyprland avisando que um app nao
# responde. Aparece no boot quando o $editor (VSCode) demora pra subir
# e fica no workspace do app que estava ativo no momento (geralmente 11).
# Se o dialog rouba foco, os outros apps que sobem em paralelo (teams,
# etc) vao pro workspace errado. Mandamos ele pro workspace 1 (igual
# ao gcr-prompter) e desabilitamos o auto-focus.
windowrule = workspace 1 silent,match:class ^(hyprland-dialog)$
windowrule = focus_on_activate off,match:class ^(hyprland-dialog)$

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
workspace = 1, monitor:HDMI-A-2
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 10, monitor:HDMI-A-2
workspace = 11, monitor:HDMI-A-1
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1