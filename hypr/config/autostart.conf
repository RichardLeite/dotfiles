# Ambxst
#exec-once = ambxst

# Import Programs variables
source = ~/.config/hypr/config/programs.conf

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# XSettings Daemon
exec-once = xsettingsd

# Portal (Gerenciado automaticamente via portals.conf e DBus)
# exec-once = /usr/lib/xdg-desktop-portal-hyprland

# System environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Network Manager
exec-once = nm-applet &

# Ponte X11 System tray → StatusNotifierItem (SNI) para o ambxst
# Faz ícones de tray de apps X11 (Wine/Rockstar) aparecerem na barra do ambxst
# Loop de reinício automático caso o processo crash
# Ponte X11 System tray → StatusNotifierItem (SNI) para o ambxst
# Necessario para apps Wine/Proton que so falam o protocolo XEmbed antigo
# (Rockstar Launcher, Spotify-Wine, Battle.net, etc). O Quickshell so le SNI
# via D-Bus, sem essa ponte os icones desses apps nao aparecem.
# A janela orfa 32x32 e escondida via windowrule no windows-workspaces.conf.
# Loop: sleep 3 inicial espera o Hyprland propagar env (Qt platform plugin
# precisa de DISPLAY/WAYLAND_DISPLAY ja no env). sleep 5 no loop reduz
# barulho caso o proxy caia em runtime (raro, so nao-mascarado).
exec-once = bash -c 'sleep 3; while true; do xembedsniproxy 2>/dev/null; sleep 5; done' &

# GNOME Keyring
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# Define RGB
exec-once = openrgb --profile Red.orp

# Animated Wallpaper
#exec-once = ~/.config/hypr/config/scripts/animated-wallpaper.sh &

# Audio Ducking (temporarily not working)
#exec-once = ~/.config/hypr/config/scripts/audio-ducking.sh &

# Hyprland specific
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Lock Screen
exec-once = bash -c "sleep 5 && ambxst lock"

# Personal applications to start at launch
# O [workspace N] tem que ficar direto no exec-once (Hyprland parseia
# esse padrao e move a janela pro workspace certo). Nao pode ficar
# dentro de bash -c. Para dar tempo do workspace alvo se estabelecer
# como ativo, usamos [workspace N silent] que evita a troca animada
# durante o boot.
exec-once = [workspace 1] $editor
exec-once = [workspace 11 silent] $browser
exec-once = [workspace 12 silent] $teams

# Remove noise from microphone
exec-once = noisetorch -i

# Connect to bluetooth speaker and start music player
exec-once = bash -c "sleep 10 && bluetoothctl connect 41:42:82:8D:0B:47"
exec-once = [workspace 13 silent] $musicPlayer